{% extends "base.html" %}

{% block content %}

<h2>Eliminar paciente</h2>

<p>¿Seguro que deseas eliminar a {{ object.nombre }}?</p>

<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger">Sí, eliminar</button>
    <a class="btn btn-secondary" href="{% url 'paciente_list' %}">Cancelar</a>
</form>

{% endblock %}
