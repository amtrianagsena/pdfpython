{% extends "base.html" %}

{% block content %}

<h1 class="mb-3">👤 Pacientes</h1>

<!-- 🔍 BUSCADOR -->
<form method="GET" class="mb-3">
    <div class="input-group">
        <input type="text"
               name="q"
               class="form-control"
               placeholder="Buscar paciente por nombre...">
        <button class="btn btn-outline-primary">
            Buscar
        </button>
    </div>
</form>

<!-- ➕ BOTÓN NUEVO -->
<a class="btn btn-primary mb-3"
   href="{% url 'paciente_create' %}">
    + Nuevo paciente
</a>

<!-- 📊 TABLA -->
<table class="table table-bordered table-hover align-middle">

    <thead class="table-dark">
        <tr>
            <th>Nombre</th>
            <th>Documento</th>
            <th>Fecha Nacimiento</th>
            <th style="width: 320px;">Acciones</th>
        </tr>
    </thead>

    <tbody>

        {% for p in pacientes %}
        <tr>

            <td>{{ p.nombre }}</td>
            <td>{{ p.documento }}</td>
            <td>{{ p.fecha_nacimiento }}</td>

            <td>

                <!-- 👁 VER -->
                <a class="btn btn-info btn-sm"
                   href="{% url 'paciente_detail' p.id %}">
                    Ver
                </a>

                <!-- ✏️ EDITAR -->
                <a class="btn btn-warning btn-sm"
                   href="{% url 'paciente_update' p.id %}">
                    Editar
                </a>

                <!-- ❌ ELIMINAR -->
                <a class="btn btn-danger btn-sm"
                   href="{% url 'paciente_delete' p.id %}">
                    Eliminar
                </a>

                <!-- 📄 PDF MEDICAMENTOS -->
                <a class="btn btn-success btn-sm"
                   href="{% url 'paciente_pdf' p.id %}">
                    PDF
                </a>

            </td>

        </tr>

        {% empty %}
        <tr>
            <td colspan="4" class="text-center">
                No hay pacientes registrados
            </td>
        </tr>
        {% endfor %}

    </tbody>

</table>

{% endblock %}
